- defaults:
      link:
          relink: true
          force: true
- clean: ["~"]

- link:
      ~/.config/alacritty/alacritty.toml:
            path: alacritty.toml
            create: true
      ~/.tmux.conf:
          path: tmux.conf
          create: false
      ~/.tmux/plugins/tpm:
          path: modules/tpm
          create: true
      ~/.config/tmux/plugins/catppuccin/tmux:
          path: modules/catppuccin/tmux
          create: true
      ~/.zshenv:
          path: zshenv
          create: false
      ~/.zshrc:
            path: zshrc
            create: false
      ~/.config/nvim:
          path: nvim
          create: true
      ~/.fzf:
          path: modules/fzf
          create: true
      ~/.config/btop/btop.conf:
          path: misc/btop.conf
          create: true
- shell:
      - [git submodule update --init --recursive, Installing submodules]
      - [~/.fzf/install --key-bindings --completion --update-rc, Installing fzf]
